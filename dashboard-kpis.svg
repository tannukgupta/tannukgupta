<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f30" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.35; }
      100% { opacity: 1; }
    }
    .metric-value { font-weight: 700; font-size: 15px; fill: #f1f5f9; }
    .metric-label { font-size: 10px; fill: #94a3b8; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .metric-sub { font-size: 11px; fill: #64748b; }
  </style>

  <!-- Outer Container with sleek border -->
  <rect x="1" y="1" width="878" height="198" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Telemetry Status Bar -->
  <line x1="20" y1="46" x2="860" y2="46" stroke="#1e293b" stroke-width="1"/>

  <g transform="translate(24, 28)">
    <circle cx="6" cy="0" r="5" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="4" fill="#10b981" class="mono" font-size="11" font-weight="600" letter-spacing="0.08em">SYSTEM STATUS: ANALYTICS RUNTIME ACTIVE</text>
  </g>

  <g transform="translate(540, 28)">
    <text x="0" y="4" fill="#64748b" class="mono" font-size="11">ROLE // DATA ANALYST &amp; BI SPECIALIST</text>
    <text x="280" y="4" fill="#38bdf8" class="mono" font-size="11" text-anchor="end">LOC: IN</text>
  </g>

  <!-- 4 Interactive KPI Telemetry Cards -->
  <!-- Card 1: Data Modeling & Architecture -->
  <g transform="translate(20, 62)">
    <rect width="198" height="118" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1.5" fill="url(#accentBlue)"/>
    <text x="14" y="24" class="metric-label mono">DATA MODELING</text>
    <text x="14" y="48" class="sans metric-value">Relational &amp; Star</text>
    <text x="14" y="68" class="sans metric-sub">Schema Design &amp; 3NF</text>
    <line x1="14" y1="80" x2="184" y2="80" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="100" class="mono" font-size="10.5" fill="#38bdf8">JOIN FAN-OUT AUDITED</text>
  </g>

  <!-- Card 2: SQL & Warehousing -->
  <g transform="translate(234, 62)">
    <rect width="198" height="118" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1.5" fill="url(#accentEmerald)"/>
    <text x="14" y="24" class="metric-label mono">QUERY ENGINE</text>
    <text x="14" y="48" class="sans metric-value">MySQL 8 &amp; Aggregations</text>
    <text x="14" y="68" class="sans metric-sub">Window Functions &amp; CTEs</text>
    <line x1="14" y1="80" x2="184" y2="80" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="100" class="mono" font-size="10.5" fill="#34d399">10,000+ RECORDS VALIDATED</text>
  </g>

  <!-- Card 3: Business Intelligence -->
  <g transform="translate(448, 62)">
    <rect width="198" height="118" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1.5" fill="url(#accentAmber)"/>
    <text x="14" y="24" class="metric-label mono">BI &amp; VISUALIZATION</text>
    <text x="14" y="48" class="sans metric-value">Microsoft Power BI</text>
    <text x="14" y="68" class="sans metric-sub">DAX &amp; Interactive Reports</text>
    <line x1="14" y1="80" x2="184" y2="80" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="100" class="mono" font-size="10.5" fill="#fbbf24">EXECUTIVE KPI REPORTING</text>
  </g>

  <!-- Card 4: Statistical EDA & Retention -->
  <g transform="translate(662, 62)">
    <rect width="198" height="118" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="198" height="3" rx="1.5" fill="url(#accentPurple)"/>
    <text x="14" y="24" class="metric-label mono">STATISTICAL EDA</text>
    <text x="14" y="48" class="sans metric-value">Python &amp; Pandas</text>
    <text x="14" y="68" class="sans metric-sub">Cohort &amp; Churn Drivers</text>
    <line x1="14" y1="80" x2="184" y2="80" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="100" class="mono" font-size="10.5" fill="#a78bfa">RETENTION &amp; BEHAVIORAL</text>
  </g>
</svg>